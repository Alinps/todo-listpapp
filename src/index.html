

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List App</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <h1 class="text-center mb-4">To-Do List</h1>
        <div class="d-flex justify-content-end mb-3">
          <!-- Minimalistic Dropdown Button -->

            <button class="btn btn-light border shadow-sm dropdown-toggle" type="button" id="optionsDropdown" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">

              <button class="dropdown-item" id="filterUncompleted">Uncompleted</button>

              <h6 class="dropdown-header">Export</h6>

              <button class="dropdown-item" id="exportJSON">Export as JSON</button>

        </div>
        <form class="mb-3">
          <div class="input-group shadow-sm">
            <input type="text" id="taskInput" class="form-control" placeholder="Add a new task" aria-label="Task">
            <input type="date" id="taskDate" class="form-control" style="max-width: 180px;" aria-label="Due date">
            <div class="input-group-append">
              <button class="btn btn-primary" id="addTaskBtn" type="button"><i class="bi bi-plus-lg"></i> Add Task</button>
            </div>
          </div>
        </form>
        <ul id="taskList" class="list-group"></ul>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body">
          <div class="card shadow border-0">
            <div class="card-header bg-danger text-white d-flex justify-content-between align-items-center">
              <h5 class="mb-0">Delete Task</h5>
              <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close" style="opacity:1;">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="card-body text-center">
              <p class="mb-4">Are you sure you want to delete this task?</p>
              <div class="d-flex justify-content-center gap-2">
                <button type="button" class="btn btn-secondary mr-2" data-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Task Modal -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editModalLabel">Edit Task</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <input type="text" id="editTaskInput" class="form-control" placeholder="Edit your task">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btncustom" data-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-success" id="saveEditBtn">Save Changes</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts: jQuery (full), Popper, Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

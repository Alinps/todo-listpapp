

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List App</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>

  <link rel="stylesheet" href="css/styles.css">
<style>
    .add-task-btn:hover, .add-task-btn:focus {
      background: linear-gradient(90deg, #764ba2 0%, #667eea 100%);
      color: #fff;
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 4px 16px rgba(102,126,234,0.25);
      }
    .add-task-btn.h-100 {
      height: 100%;
    }
</style>

</head>
<body>
  <div class="container mt-5">
      <div class="card justify-content-center">
        <div class="card-body">
           <h1 class="text-center mb-4">To-Do List</h1>
          <div class="row">
            <div class="col-sm-4">
             
            </div>
            <div class="col-sm-4">

            </div>
            <div class="col-sm-4">
            </div>
          </div>
            <form class="mb-3">
                <div class="row">
                  <div class="input-group shadow-sm">
                      <div class="col-4-sm">
                          <input type="text" id="taskInput" class="form-control" placeholder="Add a new task" aria-label="Task">
                      </div>
                      <div class="col-4-sm mr-3">
                          <input type="date" id="taskDate" class="form-control ml-2 mr-2" style="max-width: 180px;" aria-label="Due date">
                      </div>
                      <div class="col-4-sm">
                          <button class="btn add-task-btn h-100 ml-auto " id="addTaskBtn" type="button" style="background: linear-gradient(90deg, #667eea 0%, #764ba2 100%); color: #fff; border: none; box-shadow: 0 2px 8px rgba(102,126,234,0.15); transition: background 0.3s, transform 0.2s;">
                            <i class="bi bi-plus-lg"></i> Add Task
                          </button>
                      </div>
                  </div>
                </div>   
            </form>
            <div class="row">
              <div class="col-sm">
                <ul id="taskList" class="list-group"></ul>  </div>
              </div>
            </div>
            
         

          </div>
          </div>
       
        

       
    </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body">
          <div class="card shadow border-0">
            <div class="card-header bg-danger text-white d-flex justify-content-between align-items-center">
              <h5 class="mb-0">Delete Task</h5>
              <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close" style="opacity:1;">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="card-body text-center">
              <p class="mb-4">Are you sure you want to delete this task?</p>
              <div class="d-flex justify-content-center gap-2">
                <button type="button" class="btn btn-secondary mr-2" data-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Task Modal -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editModalLabel">Edit Task</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <input type="text" id="editTaskInput" class="form-control" placeholder="Edit your task">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btncustom" data-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-success" id="saveEditBtn">Save Changes</button>
        </div>
      </div>
    </div>
  </div>

 <!-- jQuery (must be first) -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

<!-- Popper.js v1 (required for Bootstrap 4) -->
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>

<!-- Bootstrap 4.5.2 JS -->
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<!-- Your app script -->
<script src="js/app.js"></script>

</body>
</html>
